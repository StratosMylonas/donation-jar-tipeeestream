<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Bar</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <noscript>
        <div style="color: red; font-size: 18px; text-align: center;">
            JavaScript is disabled or the server is not running.
        </div>
    </noscript>

    <div id="server-status" style="display:none;">⚠️ Could not connect to the donation server.</div>

    <div id="donation-goal-title">Donation Goal</div>

    <div class="donation-bar-container">
        <div class="donation-bar" id="donation-bar"></div>
        <div class="bar-title" id="bar-title">Donation Goal</div>
        <div class="bar-amount" id="bar-amount">0 / 0€ (0%)</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
